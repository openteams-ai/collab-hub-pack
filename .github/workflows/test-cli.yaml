name: Test CLI

# Runs the collab-hub CLI's tests + ruff (in cli/) on the lowest and highest
# Python it supports. The CLI is a client of the hub's REST API and imports no
# hub package, so it needs no service here: the sign-in runs against a stub
# realm, with a real redirect to the loopback listener. The real realm is
# exercised by dev-env.yaml at level 3. Fork-safe: no secrets, read-only checkout.

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/test-cli.yaml"
  pull_request: {}   # runs on every PR so it can be a required status check

permissions:
  contents: read

jobs:
  test-cli:
    name: Test CLI (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: .github/uv.toml

      - name: Lint
        working-directory: cli
        run: uv run -p ${{ matrix.python }} --with ruff ruff check src tests

      - name: Test
        working-directory: cli
        run: uv run -p ${{ matrix.python }} --group test pytest
