{{- /* The hub's root host (home.hubDomain) answers "/" with a redirect to the
home page on the host that serves the web surface. Only the exact "/" is
matched: it outranks another app's "/" prefix on the same host, and every
other path there stays with whoever routes it. */ -}}
{{- if .Values.home.rootRedirect.enabled }}
{{- if not .Values.home.hubDomain }}
{{- fail "home.rootRedirect needs home.hubDomain: the root host the redirect answers on" }}
{{- end }}
{{- $target := "" }}
{{- if and .Values.api.nebariapp.enabled .Values.api.nebariapp.hostname }}
{{- $target = .Values.api.nebariapp.hostname }}
{{- else if .Values.api.ingress.enabled }}
{{- $target = .Values.api.ingress.host }}
{{- end }}
{{- if not $target }}
{{- fail "home.rootRedirect needs the API's host: set api.nebariapp.hostname or api.ingress.host" }}
{{- end }}
{{- $component := "home" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "collab-hub.component-name" (dict "top" . "component" $component) }}
  namespace: {{ .Values.home.rootRedirect.namespace | default .Release.Namespace }}
  labels:
    {{- include "collab-hub.labels" (dict "top" . "component" $component) | nindent 4 }}
spec:
  parentRefs:
    {{- /* group and kind are the API's own defaults, written out so the
    rendered route matches the stored one and ArgoCD does not report drift. */}}
    {{- range .Values.home.rootRedirect.parentRefs }}
    - group: {{ .group | default "gateway.networking.k8s.io" | quote }}
      kind: {{ .kind | default "Gateway" | quote }}
      name: {{ .name | quote }}
      {{- with .namespace }}
      namespace: {{ . | quote }}
      {{- end }}
      {{- with .sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
      {{- with .port }}
      port: {{ . }}
      {{- end }}
    {{- end }}
  hostnames:
    - {{ .Values.home.hubDomain | quote }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: {{ $target | quote }}
            path:
              type: ReplaceFullPath
              replaceFullPath: /web/home
            statusCode: 302
{{- end }}
