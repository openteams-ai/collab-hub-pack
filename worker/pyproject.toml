[project]
name = "collab-hub-cog-worker"
version = "0.1.0"
description = "The worker side of the Collab Hub seam, once: /invoke, the envelope, the binding, sessions, and harness adapters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "pytest>=8.3.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I001",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
