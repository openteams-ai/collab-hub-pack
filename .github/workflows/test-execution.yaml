name: Test execution

# Runs the collab-hub-execution package's tests + ruff (in execution/). A Postgres
# service is provided so the Track adapter tests run (they skip without one).
# Fork-safe: no secrets, read-only checkout.

on:
  push:
    branches: [main]
    paths:
      - "execution/**"
      - "docs/cog-execution/states.md"
      - "dev/cogs/**"
      - "cogs/**"
      - "worker/**"
      - "dev/fake-model/**"
      - "dev/fake-agent/**"
      - ".github/workflows/test-execution.yaml"
  pull_request: {}   # runs on every PR so it can be a required status check

# uv uses only uv-managed CPython builds here, never the runner's system
# Python: a system 3.14 (ubuntu-26.04 ships 3.14.4) would satisfy a 3.14
# request without CPython's ssl eMudhra denylist (#285).
env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  test-execution:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: track
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:pw@localhost:5432/track
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .github/uv.toml

      # -p 3.14: the hub image's minor version, as a uv-managed build (see the
      # workflow's env), not whatever Python the runner happens to ship.
      - name: Lint
        working-directory: execution
        run: uv run -p 3.14 --with ruff ruff check src tests

      - name: Test
        working-directory: execution
        run: uv run -p 3.14 --group test pytest


  test-execution-macos:
    # The local location's workers and reaper on macOS, which dev/ supports at level 1. No Postgres
    # service on these runners: the Postgres Track tests skip here and run in the job above. The job
    # reports and does not block: what fails on these runners (readiness deadlines, /private/var, the
    # reaper's view of another process) is #214, and a merge waits on the Linux job.
    # Disabled for now, as its broken, takes forever and uses high CI credits
    runs-on: macos-latest
    continue-on-error: true
    if: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .github/uv.toml

      - name: Test
        working-directory: execution
        run: uv run -p 3.13 --group test pytest
