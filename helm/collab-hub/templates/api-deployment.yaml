{{- if .Values.api.enabled }}
{{- $component := "api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "collab-hub.component-name" (dict "top" . "component" $component) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "collab-hub.labels" (dict "top" . "component" $component) | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.deployment.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "collab-hub.selectorLabels" (dict "top" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "collab-hub.labels" (dict "top" . "component" $component) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "collab-hub.api-service-account-name" . }}
      {{- with .Values.api.deployment.securityContext.pod }}
      securityContext:
        {{- . | toYaml | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.deployment.image.repository }}:{{ .Values.api.deployment.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.deployment.image.pullPolicy }}
          {{- with .Values.api.deployment.securityContext.container }}
          securityContext:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          env:
            {{- include "collab-hub.api-container-env" (dict "top" . "indexer" false) | nindent 12 }}
          resources:
            {{- toYaml .Values.api.deployment.resources | nindent 12 }}
          ports:
            - containerPort: {{ .Values.api.service.targetPort }}
          volumeMounts:
            - name: frames-storage
              mountPath: {{ .Values.frames.storage.mountPath }}
            {{- if .Values.cogs.caBundle.configMap }}
            - name: cogs-ca-bundle
              mountPath: {{ include "collab-hub.cogs-ca-bundle-mount-path" . }}
              readOnly: true
            {{- end }}
          startupProbe:
            httpGet:
              port: {{ .Values.api.service.targetPort }}
              path: /health
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              port: {{ .Values.api.service.targetPort }}
              path: /health
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
      volumes:
        - name: frames-storage
          {{- if or .Values.frames.storage.persistence.enabled .Values.frames.storage.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ include "collab-hub.frames-storage-claim" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.cogs.caBundle.configMap }}
        - name: cogs-ca-bundle
          configMap:
            name: {{ .Values.cogs.caBundle.configMap | quote }}
            items:
              - key: {{ .Values.cogs.caBundle.key | quote }}
                path: {{ .Values.cogs.caBundle.key | quote }}
        {{- end }}
{{- end }}
