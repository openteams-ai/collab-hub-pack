name: Test execution

# Runs the collab-hub-execution package's tests + ruff (in execution/). A Postgres
# service is provided so the Track adapter tests run (they skip without one).
# Fork-safe: no secrets, read-only checkout.

on:
  push:
    branches: [main]
    paths:
      - "execution/**"
      - "docs/cog-execution/states.md"
      - "dev/cogs/**"
      - "cogs/**"
      - "dev/fake-model/**"
      - ".github/workflows/test-execution.yaml"
  pull_request: {}   # runs on every PR so it can be a required status check

jobs:
  test-execution:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: track
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:pw@localhost:5432/track
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Lint
        working-directory: execution
        run: uv run --with ruff ruff check src tests

      - name: Test
        working-directory: execution
        run: uv run --group test pytest
