name: Dev Environment

# Checks that `dev/` still runs the pack, because nothing else does: the test
# workflow is pytest in api/ and the lint workflow renders the chart, so a
# broken local-development setup reaches contributors before it reaches CI.
#
# Fork-safe: no secrets, read-only checkout, no registry logins.
#
# Coverage relaxes as the levels get more expensive, which is also how the
# levels themselves are meant to be used:
#
#   level 1  both macOS and Linux, no containers at all      ~1 min
#   level 2  Linux, Postgres + the S3 frame store            ~2 min
#   level 3  Linux, + Keycloak (the one heavy image)         ~3 min
#   level 4  rendered only -- no cluster, no node image      ~1 min
#
# Level 1 is the one that runs on macOS: GitHub's macOS runners have no Docker,
# and level 1 is precisely the level that needs none. That is not a compromise
# -- macOS is where the portability bugs live (`getent` is glibc-only), so it
# is the level worth running there.

on:
  push:
    branches: [main]
    paths:
      - "dev/**"
      - "cli/**"
      - "execution/**"
      - "scripts/smoke_frames_common.sh"
      - "scripts/keycloak_login_browser.py"
      - "helm/**"
      - ".github/workflows/dev-env.yaml"
  pull_request: {}   # runs on every PR so it can be a required status check

concurrency:
  group: dev-env-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Level 1 -- the API alone. No Docker, so this is the level macOS can run.
  # ---------------------------------------------------------------------------
  level-1:
    name: Level 1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      # The check that broke on macOS: `getent` does not exist there, and a
      # resolver that cannot see /etc/hosts would block the desktop targets.
      # It must pass on a runner with no entries added, because localhost and
      # the loopback names it is asked about are not the point -- the point is
      # that the check runs at all rather than erroring out.
      - name: hosts-check resolves a name that certainly exists
        run: make -C dev hosts-check DESKTOP_HOSTS=localhost

      - name: hosts-check still rejects a name that does not
        run: |
          if make -C dev hosts-check DESKTOP_HOSTS=nope.invalid >/dev/null 2>&1; then
            echo "hosts-check passed a hostname that does not resolve"; exit 1
          fi
          echo "correctly refused"

      - name: make api serves frames and the Cog catalog with no token
        run: |
          set -euo pipefail
          make -C dev api > /tmp/api.log 2>&1 &
          trap 'pkill -f "collab_hub_api" || true' EXIT

          for _ in $(seq 1 45); do
            curl -sf -m 2 -o /dev/null http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf -m 5 -o /dev/null http://127.0.0.1:8000/health \
            || { echo "API never came up"; tail -40 /tmp/api.log; exit 1; }

          # Dev auth: no Authorization header anywhere in this block.
          id=$(curl -sfS -m 10 -X POST http://127.0.0.1:8000/v1/frames \
                 -H 'Content-Type: application/json' \
                 -d '{"name":"ci","body":"# from CI"}' \
               | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "created frame $id"

          body=$(curl -sfS -m 10 "http://127.0.0.1:8000/v1/frames/$id" \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["body"])')
          [ "$body" = "# from CI" ] || { echo "read back '$body'"; exit 1; }

          # Level 1 keeps frames on disk and everything else in memory.
          test -d dev/.local/frames || { echo "no local frame store"; exit 1; }

          # The Cog catalog read API (#85) answers from the in-memory catalog:
          # an empty page and an empty compatibility view, not a 503.
          page=$(curl -sfS -m 10 http://127.0.0.1:8000/v1/cogs)
          [ "$page" = '{"items":[],"limit":50,"offset":0,"next_offset":null}' ] \
            || { echo "GET /v1/cogs returned $page"; exit 1; }
          view=$(curl -sfS -m 10 http://127.0.0.1:8000/v1/cogs/catalog.v1.json)
          [ "$view" = '{"schemaVersion":1,"repositories":[]}' ] \
            || { echo "GET /v1/cogs/catalog.v1.json returned $view"; exit 1; }

          # The collab-hub CLI against dev auth: nobody is signed in, and it says so.
          make -C dev cli
          export COLLAB_HUB_CONFIG_DIR="$RUNNER_TEMP/collab-hub" COLLAB_HUB_URL=http://127.0.0.1:8000
          cli/.venv/bin/collab-hub login 2>&1 | grep -q "runs dev auth" \
            || { echo "login did not say the hub runs dev auth"; exit 1; }
          cli/.venv/bin/collab-hub whoami --json | python3 -c '
          import json, sys
          me = json.load(sys.stdin)
          assert me["authenticated_by"] == "dev" and me["signed_in"] is False, me
          assert me["user"] == "dev-user", me
          print("whoami reports unauthenticated dev auth as", me["user"])'
          [ "$(cli/.venv/bin/collab-hub cog list --json)" = "[]" ] \
            || { echo "collab-hub cog list did not report the empty catalog"; exit 1; }

      # The runner on the `none` backend, the fake Cogs answering in process: each fake Op ends where it
      # should, and a run stopped mid-step is recorded interrupted when the next
      # host starts, never resumed (ADR-0002 D2).
      - name: make op runs the fake Ops, and a stopped run is interrupted
        run: |
          set -euo pipefail
          status() { make -s -C dev op OP="$1" | tee /tmp/op-"$1".log | sed -n 's/^status: //p'; }
          [ "$(status echo)" = COMPLETED ]                || { cat /tmp/op-echo.log; exit 1; }
          [ "$(status needs-review)" = WAITING_AT_GATE ]  || { cat /tmp/op-needs-review.log; exit 1; }
          [ "$(status fails)" = FAILED ]                  || { cat /tmp/op-fails.log; exit 1; }
          [ "$(status spender)" = BUDGET_EXCEEDED ]       || { cat /tmp/op-spender.log; exit 1; }

          # Kill the host during a 30-second step, then start another host. SIGTERM, since a
          # background job in a non-interactive shell starts with SIGINT ignored.
          make -s -C dev op OP=slow > /tmp/op-slow.log 2>&1 &
          for _ in $(seq 1 60); do grep -q '^run slow-' /tmp/op-slow.log && break; sleep 1; done
          run=$(sed -n 's/^run \(slow-[0-9a-f]*\) .*/\1/p' /tmp/op-slow.log)
          [ -n "$run" ] || { echo "the slow Op never started"; cat /tmp/op-slow.log; exit 1; }
          sleep 2
          pkill -TERM -f "dev/op.py slow"
          wait || true
          make -s -C dev op OP=echo | tee /tmp/op-after.log
          grep -q "^interrupted $run:" /tmp/op-after.log \
            || { echo "the stopped run was not recorded interrupted"; exit 1; }

      # The `local` agent location: the same fake Cog as a real process, its `serve` task run in the
      # package's own pixi environment by the local executor. A host killed with SIGKILL runs no
      # teardown, and still leaves no worker behind: the launcher that holds the worker sees its
      # pipe to the host close, and kills the worker's process group (ADR-0002 D12).
      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false

      - name: make op LOCATION=local runs a fake Cog as a process, and a killed host leaves no worker
        run: |
          set -euo pipefail
          workers() { pgrep -f 'dev/cogs/[a-z-]*/\.pixi/envs' || true; }
          make -s -C dev op OP=echo LOCATION=local | tee /tmp/op-local.log
          grep -q '^status: COMPLETED' /tmp/op-local.log
          [ "$(grep -c ' worker_started .*location=local' /tmp/op-local.log)" = 2 ] \
            || { echo "the steps did not run as local worker processes"; exit 1; }
          [ "$(grep -c ' worker_stopped ' /tmp/op-local.log)" = 2 ]
          [ -z "$(workers)" ] || { echo "a worker outlived its step"; exit 1; }

          make -s -C dev op OP=slow LOCATION=local > /tmp/op-slow-local.log 2>&1 &
          for _ in $(seq 1 120); do [ -n "$(workers)" ] && break; sleep 1; done
          [ -n "$(workers)" ] || { echo "the slow Cog's worker never started"; cat /tmp/op-slow-local.log; exit 1; }
          run=$(sed -n 's/^run \(slow-[0-9a-f]*\) .*/\1/p' /tmp/op-slow-local.log)
          pkill -KILL -f "dev/op.py slow"
          wait || true
          for _ in $(seq 1 20); do [ -z "$(workers)" ] && break; sleep 1; done
          [ -z "$(workers)" ] || { echo "a worker outlived its killed host:"; ps -p "$(workers)" -o pid,command; exit 1; }
          make -s -C dev op OP=echo | tee /tmp/op-after-kill.log
          grep -q "^interrupted $run:" /tmp/op-after-kill.log \
            || { echo "the killed host's run was not recorded interrupted"; exit 1; }

      - name: make clean removes the scratch state
        run: |
          make -C dev clean
          test ! -d dev/.local || { echo "dev/.local survived make clean"; exit 1; }

      - name: API log on failure
        if: failure()
        run: tail -60 /tmp/api.log || true

  # ---------------------------------------------------------------------------
  # Levels 2 and 3 -- one Linux runner, because level 3 reuses level 2's
  # containers and re-pulling them in a second job would cost more than it buys.
  # ---------------------------------------------------------------------------
  levels-2-3:
    name: Levels 2 and 3 (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Level 2 -- Postgres makes the 503 endpoints answer
        run: |
          set -euo pipefail
          make -C dev api-pg > /tmp/api-pg.log 2>&1 &
          trap 'pkill -f "collab_hub_api" || true' EXIT

          for _ in $(seq 1 60); do
            curl -sf -m 2 -o /dev/null http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf -m 5 -o /dev/null http://127.0.0.1:8000/health \
            || { echo "API never came up"; tail -40 /tmp/api-pg.log; exit 1; }

          # /health/db answers 200 either way, so the body is the assertion.
          db=$(curl -sfS -m 10 http://127.0.0.1:8000/health/db)
          echo "$db" | grep -q '"status":"ok"' \
            || { echo "expected a configured database, got: $db"; exit 1; }

          # 503 at level 1, 200 here. This is the whole point of level 2.
          code=$(curl -s -m 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/v1/frame-groups)
          [ "$code" = "200" ] || { echo "frame-groups returned $code, expected 200"; exit 1; }

          # The Cog catalog on Postgres (migration 7): every filter the list
          # route builds, so the SQL itself runs against a real server here.
          code=$(curl -s -m 10 -o /dev/null -w '%{http_code}' \
                   'http://127.0.0.1:8000/v1/cogs?kind=complete&publisher=p&requires=c&provides=x&accepts=a&produces=b&q=50%25_&source_id=s&offset=1')
          [ "$code" = "200" ] || { echo "filtered /v1/cogs returned $code, expected 200"; exit 1; }
          view=$(curl -sfS -m 10 http://127.0.0.1:8000/v1/cogs/catalog.v1.json)
          [ "$view" = '{"schemaVersion":1,"repositories":[]}' ] \
            || { echo "GET /v1/cogs/catalog.v1.json returned $view"; exit 1; }

          # The Track tables (migration 12) come from the migration registry the
          # API ran at startup and from nowhere else: the one module of the API
          # that imports the execution package is the run router, which is
          # behind the cog_runs feature flag, off here, and keeps its Track in a
          # SQLite file, so nothing else could have created them.
          psql='docker compose -f dev/compose.yaml exec -T postgres psql -U collab -d collab -tAc'
          tables=$($psql "SELECT count(*) FROM pg_tables WHERE tablename IN ('collab_track_events', 'collab_track_payloads')")
          [ "$tables" = "2" ] || { echo "expected the two Track tables from migrations, found $tables"; exit 1; }
          applied=$($psql "SELECT max(version) FROM collab_schema_migrations")
          [ "$applied" -ge 12 ] || { echo "expected migration 12 applied, latest is $applied"; exit 1; }
          importers=$(grep -rl --include='*.py' "collab_hub_execution" api/src | sort | tr '\n' ' ')
          [ "$importers" = "api/src/collab_hub_api/routers/runs.py " ] \
            || { echo "only the run router may import the execution package; found: $importers"; exit 1; }

          pkill -f "collab_hub_api" || true
          sleep 2

      - name: Level 3 -- real Keycloak bearer tokens
        run: |
          set -euo pipefail
          make -C dev api-oidc > /tmp/api-oidc.log 2>&1 &
          trap 'pkill -f "collab_hub_api" || true' EXIT

          for _ in $(seq 1 90); do
            curl -sf -m 2 -o /dev/null http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf -m 5 -o /dev/null http://127.0.0.1:8000/health \
            || { echo "API never came up"; tail -60 /tmp/api-oidc.log; exit 1; }

          # The dev-auth shortcut must be off at this level.
          code=$(curl -s -m 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/v1/frames)
          [ "$code" = "401" ] || { echo "unauthenticated request returned $code, expected 401"; exit 1; }

          token=$(make -s -C dev token)
          code=$(curl -s -m 10 -o /dev/null -w '%{http_code}' \
                   -H "Authorization: Bearer $token" http://127.0.0.1:8000/v1/frames)
          [ "$code" = "200" ] || { echo "authenticated request returned $code, expected 200"; exit 1; }

          # A realm client that loses the `basic` scope issues tokens with no
          # `sub`, and the hub then authenticates nobody. Cheap to assert here.
          sub=$(make -s -C dev sub)
          [ -n "$sub" ] || { echo "token carries no sub claim"; exit 1; }
          echo "authenticated as $sub"

          # The collab-hub CLI signs in the way the desktop does: the apollo-desktop
          # client, PKCE, a 127.0.0.1 redirect. The "browser" fills the realm's
          # login form as dev/dev and follows the redirect back to the CLI.
          make -C dev cli
          export COLLAB_HUB_CONFIG_DIR="$RUNNER_TEMP/collab-hub"
          CLI=cli/.venv/bin/collab-hub
          BROWSER="python3 $PWD/scripts/keycloak_login_browser.py %s" \
            timeout 120 $CLI --hub http://127.0.0.1:8000 login
          $CLI whoami --json | python3 -c '
          import json, sys
          me = json.load(sys.stdin)
          assert me["authenticated_by"] == "token" and me["signed_in"] is True, me
          assert me["email"] == "dev@example.com" and me["token_expires_at"], me
          print("signed in through the browser flow as", me["email"])'
          [ "$(stat -c %a "$COLLAB_HUB_CONFIG_DIR/credentials/default.json")" = "600" ] \
            || { echo "the stored session is readable by others"; exit 1; }
          $CLI cog list --json > /dev/null
          $CLI logout
          [ -z "$(ls -A "$COLLAB_HUB_CONFIG_DIR/credentials")" ] \
            || { echo "logout left a session on disk"; exit 1; }
          code=0; $CLI whoami > /dev/null 2>&1 || code=$?
          [ "$code" = "5" ] || { echo "whoami after logout exited $code, expected 5"; exit 1; }

          # And with a token instead of a browser, as a script would.
          make -s -C dev token | $CLI --hub http://127.0.0.1:8000 login --with-token
          $CLI whoami --json | python3 -c 'import json, sys; assert json.load(sys.stdin)["email"] == "dev@example.com"'

      - name: Logs on failure
        if: failure()
        run: |
          tail -60 /tmp/api-pg.log 2>/dev/null || true
          tail -60 /tmp/api-oidc.log 2>/dev/null || true
          make -C dev ps || true
          timeout 15 make -C dev logs || true

      - name: Stop the stack
        if: always()
        run: make -C dev down || true

  # ---------------------------------------------------------------------------
  # Level 4 -- rendered, not run. A kind cluster pulls a ~1 GB node image and
  # builds the API image before it can tell us anything; rendering catches the
  # failures that actually recur here (values drift, a chart change, and the
  # IMAGE override silently not reaching the install) in seconds.
  # ---------------------------------------------------------------------------
  level-4-render:
    name: Level 4 (rendered, no cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          # Pinned: when the latest-release lookup fails the action falls back to
          # Helm 3, whose schema errors the negative render tests do not expect.
          version: v4.3.0

      - name: The chart renders with the dev values
        run: |
          set -euo pipefail
          helm lint helm/collab-hub
          helm template collab-hub helm/collab-hub \
            -f dev/values/kind.yaml --set namespace.create=false \
            -n collab-hub > /tmp/rendered.yaml
          grep -q 'imagePullPolicy: Never' /tmp/rendered.yaml \
            || { echo "the kind values no longer pin pullPolicy: Never"; exit 1; }

      - name: The dev-auth switches are legal in this install
        run: |
          set -euo pipefail
          # values/kind.yaml enables neither the NebariApp nor the Ingress, which
          # is what keeps the protection map unenforced and the dev-auth
          # extraEnv renderable. If that ever flips, the chart refuses to render
          # and this fails -- which is the point.
          for var in FRAMES_UNSAFE_AUTH_ENABLED DEV_AUTH_ENABLED DEV_AUTH_USER; do
            grep -q "$var" /tmp/rendered.yaml || { echo "$var missing from the render"; exit 1; }
          done
          grep -q 'COLLAB_HUB_API__SECURITY__DEFAULT_ACCESS' /tmp/rendered.yaml

      - name: IMAGE reaches the install
        run: |
          set -euo pipefail
          # kind-image builds and loads $(IMAGE); kind-up must deploy the same
          # one. Rendering is enough to prove the wiring without a cluster.
          rendered=$(helm template collab-hub helm/collab-hub \
            -f dev/values/kind.yaml --set namespace.create=false -n collab-hub \
            --set api.deployment.image.repository=collab-hub-api \
            --set api.deployment.image.tag=ci-probe | grep -m1 'image:')
          echo "$rendered" | grep -q 'collab-hub-api:ci-probe' \
            || { echo "the image override did not reach the Deployment: $rendered"; exit 1; }

      - name: Compose resolves, and the port overrides move together
        run: |
          set -euo pipefail
          docker compose -f dev/compose.yaml --profile auth --profile fakes --profile desktop config -q

          out=$(DESKTOP_PORT=9090 API_PORT=8010 docker compose -f dev/compose.yaml \
                  --profile auth --profile desktop config)
          echo "$out" | grep -q 'API_UPSTREAM: host.docker.internal:8010' \
            || { echo "API_PORT did not reach the front door's upstream"; exit 1; }
          echo "$out" | grep -q 'DESKTOP_PORT: "9090"' \
            || { echo "DESKTOP_PORT did not reach the front door's listener"; exit 1; }
          echo "$out" | grep -q 'published: "9090"' \
            || { echo "DESKTOP_PORT did not reach the published port"; exit 1; }

      - name: The realm ships what the clients need
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          realm = json.load(open("dev/keycloak/realm-nebari.json"))
          assert realm["realm"] == "nebari", realm["realm"]
          clients = {c["clientId"]: c for c in realm["clients"]}
          assert set(clients) == {"apollo-desktop", "collab-web"}, sorted(clients)

          # `basic` carries the sub mapper in Keycloak 25+. Without it the hub
          # authenticates nobody once identity is pinned to sub.
          for name, c in clients.items():
              assert "basic" in c["defaultClientScopes"], f"{name} lost the basic scope"

          # The desktop's audience check, and the web client's port-agnostic
          # redirect (Keycloak honours a wildcard only at the end of a URI).
          mappers = clients["apollo-desktop"].get("protocolMappers", [])
          assert any(m["protocolMapper"] == "oidc-audience-mapper" for m in mappers), \
              "apollo-desktop lost its audience mapper"

          # The desktop and the collab-hub CLI sign in through apollo-desktop with
          # PKCE and a redirect to a 127.0.0.1 port the system picks.
          desktop = clients["apollo-desktop"]
          assert desktop["publicClient"] and desktop["standardFlowEnabled"], "apollo-desktop is no public code-flow client"
          assert desktop["attributes"].get("pkce.code.challenge.method") == "S256", "apollo-desktop lost PKCE S256"
          assert "http://127.0.0.1:*/*" in desktop["redirectUris"], "apollo-desktop lost its loopback redirect"
          assert "http://localhost:*" in clients["collab-web"]["redirectUris"], \
              "collab-web can no longer follow an API_PORT override"
          print("realm looks right")
          PY
