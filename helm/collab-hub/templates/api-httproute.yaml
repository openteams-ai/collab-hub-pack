{{- /* Gateway API alternative to the Ingress above, for clusters whose only
router is a Gateway (Envoy Gateway, for example, serves no Ingress objects).
TLS terminates on the parent Gateway's listener rather than on this object, so
`api.ingress.tls` here only decides whether the chart asks cert-manager for the
listener's certificate (see api-certificate.yaml). */ -}}
{{- if and .Values.api.enabled .Values.api.ingress.enabled (eq .Values.api.ingress.kind "HTTPRoute") }}
{{- $component := "api" }}
{{- $name := include "collab-hub.component-name" (dict "top" . "component" $component) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "collab-hub.labels" (dict "top" . "component" $component) | nindent 4 }}
  {{- with .Values.api.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.api.ingress.parentRefs }}
    - name: {{ .name | quote }}
      {{- with .namespace }}
      namespace: {{ . | quote }}
      {{- end }}
      {{- with .sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
      {{- with .port }}
      port: {{ . }}
      {{- end }}
    {{- end }}
  hostnames:
    - {{ .Values.api.ingress.host | quote }}
  rules:
    {{- /* Pulls through the Hub (issue #179): /v2 streams blobs, which can
    take far longer than an API call. The rule exists to carry that timeout;
    the app authenticates /v2 itself, like every other path. Listed first so
    it wins over a "/" prefix whatever the implementation's tie-breaking. */}}
    {{- if and .Values.cogs.serve.enabled .Values.cogs.serve.routeTimeout }}
    - matches:
        - path:
            type: PathPrefix
            value: /v2
      timeouts:
        request: {{ printf "%ds" (add (int64 .Values.cogs.serve.maxBlobSeconds) 30) | quote }}
      backendRefs:
        - name: {{ $name }}
          port: {{ $.Values.api.service.port }}
    {{- end }}
    {{- range .Values.api.ingress.paths }}
    - matches:
        - path:
            {{- /* Gateway API spells Ingress's "Prefix" as "PathPrefix"; the
            chart keeps one vocabulary in values and translates here. */}}
            type: {{ if eq .pathType "Prefix" }}PathPrefix{{ else }}{{ .pathType }}{{ end }}
            value: {{ .path | quote }}
      backendRefs:
        - name: {{ $name }}
          port: {{ $.Values.api.service.port }}
    {{- end }}
{{- end }}
