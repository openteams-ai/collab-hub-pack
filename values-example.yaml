# Example values for a Collab Hub API install. Copy, adjust, and pass with
# `-f`. See helm/collab-hub/values.yaml for the full reference.

api:
  deployment:
    image:
      # Pin a specific published tag in production (e.g. sha-<short> from a
      # build run); "latest" tracks main.
      tag: "latest"
    replicaCount: 1
  # Expose the API on the Nebari cluster (NebariApp -> HTTPRoute + TLS + OIDC).
  nebariapp:
    enabled: true
    hostname: collab-hub.example.com

frames:
  auth:
    bearer:
      # Point at your cluster's Keycloak realm.
      jwksUrl: https://keycloak.example.com/realms/nebari/protocol/openid-connect/certs
      issuer: https://keycloak.example.com/realms/nebari
      audience: apollo-desktop
    defaults:
      orgId: nebari
      workspaceId: default
  # Frame content storage. Defaults to the local filesystem (no object store
  # needed). For durable/shared storage, use any S3-compatible endpoint:
  storage:
    backend: local            # or: s3
  # s3:                       # any S3-compatible store — set endpointUrl for non-AWS
  #   bucket: collab-hub-frames
  #   prefix: frames
  #   endpointUrl: ""         # e.g. https://s3.example.com (blank = AWS)
  #   region: us-west-2

  # State/history/tasks default to in-memory. For persistence, point at ANY
  # Postgres (the history/group endpoints need this; otherwise they return 503):
  # postgres:
  #   existingSecret: collab-hub-postgres   # key DATABASE_URL
  #   databaseUrlKey: DATABASE_URL
  #   autoMigrate: true
  # activeState:
  #   backend: postgres
  #   postgres:
  #     existingSecret: collab-hub-postgres
  #     databaseUrlKey: DATABASE_URL

# Running Cogs (docs/standalone-deployment.md, "Running Cogs in pods"): a run controller as a Deployment of
# its own, each Cog installed by digest from the catalog and run as a pod pulled from its own artifact.
# The models block is what the inventory an installed Cog's `resolve` sees is generated from: one entry
# per served model, with its key named by reference (`auth_ref = "env:NAME"`, the variable extraEnv puts
# it in) and never written here.
runs:
  controller:
    enabled: false
    location: remote
    models: |
      [models.default]
      provider = "openai-compatible"
      endpoint = "http://llm-serving.llm.svc.cluster.local:8000/v1"
      model = "served-model"
      auth_ref = "env:MODEL_KEY"
      locality = "in-cluster"
      context_window = 131072
      max_output_tokens = 8192
    extraEnv:
      - name: MODEL_KEY
        valueFrom:
          secretKeyRef: {name: model-key, key: api-key}
    worker:
      # A ReadWriteMany claim you create in the workers' namespace: the cache every worker pod shares, each
      # package under its artifact's digest and one environment per pixi.lock digest, so a second run on the
      # same lock finds the environment; an uninstall evicts through a pod of that namespace. Empty for an
      # emptyDir per pod.
      cacheClaim: ""
      # user:secret for the registry the install references name: the hub's own /v2 when cogs.serve.enabled
      # (POST /v1/cogs/registry-credentials), else the backing registry's. Read by the init container alone.
      registryCredential:
        existingSecret: ""
        key: credential
