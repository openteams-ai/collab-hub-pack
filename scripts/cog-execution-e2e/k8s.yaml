apiVersion: v1
kind: Namespace
metadata:
  name: cogs-e2e
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cog-executor
  namespace: cogs-e2e
---
# Least-privilege: the executor may manage exactly the workloads it materializes,
# scoped to its namespace (issue #6).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cog-executor
  namespace: cogs-e2e
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "delete", "deletecollection"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cog-executor
  namespace: cogs-e2e
subjects:
  - kind: ServiceAccount
    name: cog-executor
    namespace: cogs-e2e
roleRef:
  kind: Role
  name: cog-executor
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: op-driver
  namespace: cogs-e2e
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: op-driver
    spec:
      serviceAccountName: cog-executor
      restartPolicy: Never
      containers:
        - name: driver
          image: collab-hub/cog-e2e:test
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "e2e.driver"]
          env:
            - name: E2E_NAMESPACE
              value: cogs-e2e
            - name: E2E_RUNNER_IMAGE
              value: collab-hub/cog-e2e:test
