[project]
name = "collab-hub-api"
version = "0.8.3"
description = "Collab Hub API"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "OpenTeams", email = "info@openteams.com" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.35.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.0",
    "l2sl>=0.4.0",
    "mcp>=1.13.0",
    "prometheus-client>=0.23.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic-settings>=2.14.1",
    "pyjwt[crypto]>=2.15.0",
    "pyyaml>=6.0",
    "uvicorn>=0.48.0",
    "uvloop>=0.22.1; sys_platform != 'win32'",
]

[dependency-groups]
# The run API (/v1/runs, behind the cog_runs feature flag) uses the execution
# package. It is a group, not a dependency, until the flag is retired: the
# image does not ship it, and a deployment without the flag never imports it.
runs = [
    "collab-hub-execution",
]
test = [
    { include-group = "runs" },
    "diff-cover>=9.0.0",
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.uv.sources]
collab-hub-execution = { path = "../execution", editable = true }

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[project.urls]
Repository = "https://github.com/openteams-ai/collab-hub-pack"

[tool.ruff]
# The floor of requires-python, not the newest version: with a newer target,
# `ruff format` rewrites `except (A, B):` into syntax 3.13 cannot parse.
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I001",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Measure coverage of the application package on every run and emit both a
# terminal report and an XML report (the latter feeds the patch-coverage check
# in CI). The global floor is applied in CI via --cov-fail-under so that a
# deliberately-scoped local run isn't failed for not exercising everything.
addopts = "--cov=collab_hub_api --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["collab_hub_api"]
