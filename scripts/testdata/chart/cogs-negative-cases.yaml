# Every configuration the Cog registry block refuses, written once (issue #87).
#
# The same rules live in three layers: values.schema.json (structure and
# grammar), templates/cogs-validations.yaml (cross-field rules, at render
# time) and the API's config.py / cogs/registry.py (at startup). This fixture
# is what keeps them from drifting. Each case carries the refused
# configuration in two forms:
#
#   values    the chart values an operator would write
#   settings  the `cogs` settings the chart renders from those values, as the
#             API's Config receives them (snake_case; Secret indirections as
#             the *_env names the chart derives)
#
# and two consumers read it:
#
#   scripts/chart_rules_parity.py (via chart_render_tests.sh, lint workflow)
#     renders `values` and asserts the chart refuses it with `chart_error`
#     (and, when `template_error` is set, that the template alone refuses it
#     with the schema skipped); then renders again with the schema skipped
#     and the validations template removed and asserts the rendered JSON
#     equals `settings`, so the two forms are proven to describe the same
#     configuration. It also asserts every `fail` in cogs-validations.yaml is
#     exercised by some case here.
#   api/tests/test_config_cogs.py
#     feeds `settings` to Config and asserts the API refuses it with
#     `app_error`; or, for a rule that can only live in the chart, that the
#     API accepts what the chart would have rendered, with `why_chart_only`
#     recording the reason. `env` names variables the test sets first, for
#     cases whose settings carry a Secret indirection.
#
# Fields: name, layers (schema|template, informational), values, chart_error
# (regex over helm's output), template_error (optional regex, asserted with
# --skip-schema-validation so the template refuses on its own), schema_error
# (optional regex, asserted with the validations template removed so the
# schema refuses on its own), settings (optional), env (optional), exactly one
# of app_error (regex over the ValidationError) / why_chart_only, and
# compare_render (default true; false where the chart drops the offending key
# so there is no equivalent JSON to compare).
#
# `accepted` lists configurations at the boundary that every layer must let
# through: the full chart renders them, the rendered settings equal the
# fixture's settings form, and Config accepts them.
#
# Two deliberate asymmetries, both in the direction of the chart refusing
# what the API would take. (1) Normalization: the chart validates values as
# written; the API normalizes first (strips surrounding whitespace, and
# urlsplit lowercases the scheme). So ` cogs ` or `HTTPS://…` fails the
# render but would be accepted by a bare process. (2) Host grammar: the API
# accepts whatever urlsplit parses — internationalized hostnames, IPvFuture
# literals (`[v1.foo]`), hostnames with characters outside [A-Za-z0-9._-] —
# and the chart does not. A values file is authored, and the render refuses
# what the API would have silently corrected or tolerated. Zone-scoped IPv6
# literals (`[fe80::1%25eth0]`) and zero-padded or empty ports are accepted
# by both.
#
# What the coverage check does and does not prove: every fail() literal in
# cogs-validations.yaml must have fired for some case, so a template rule
# added without a case fails here. Schema and API rules have no automatic
# inventory — this file enumerates them, and a new one needs a case added by
# hand (a case without the rule in every layer fails that layer's test).
# API-only checks the chart cannot express (credentials both-or-neither, a
# *_env name that is blank, unset or conflicts with an inline value) are
# tested directly in api/tests/test_config_cogs.py, not here.

cases:
  # --- cross-field rules mirrored in the template and the API -----------------

  - name: index enabled with zero sources
    layers: [template]
    values:
      cogs:
        index: {enabled: true}
    chart_error: 'cogs.index.enabled=true with no cogs.registry.sources'
    settings:
      index: {enabled: true}
    app_error: 'cogs.index.enabled is true but cogs.registry_sources is empty'

  - name: duplicate source id
    layers: [template]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
            - {id: public, kind: static, url: https://other.example.com, repositories: [cogs/beta]}
    chart_error: 'reuses an id'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
        - {id: public, kind: static, url: https://other.example.com, repositories: [cogs/beta]}
    app_error: 'reuses id'

  - name: harbor without projects
    layers: [template]
    values:
      cogs:
        registry:
          sources:
            - {id: h, kind: harbor, url: https://harbor.example.com}
    chart_error: 'needs at least one entry in projects'
    settings:
      registry_sources:
        - {id: h, kind: harbor, url: https://harbor.example.com}
    app_error: 'requires at least one entry in projects'

  - name: static without repositories or indexUrl
    layers: [template]
    values:
      cogs:
        registry:
          sources:
            - {id: s, kind: static, url: https://registry.example.com}
    chart_error: 'needs repositories and/or indexUrl'
    settings:
      registry_sources:
        - {id: s, kind: static, url: https://registry.example.com}
    app_error: 'requires repositories and/or index_url'

  - name: harbor with repositories
    layers: [template]
    values:
      cogs:
        registry:
          sources:
            - {id: harbor-main, kind: harbor, url: https://harbor.example.com, projects: [cogs], repositories: [cogs/x]}
    chart_error: 'does not read repositories or indexUrl'
    settings:
      registry_sources:
        - {id: harbor-main, kind: harbor, url: https://harbor.example.com, projects: [cogs], repositories: [cogs/x]}
    app_error: 'does not read repositories'

  - name: harbor with indexUrl
    layers: [template]
    values:
      cogs:
        registry:
          sources:
            - id: harbor-main
              kind: harbor
              url: https://harbor.example.com
              projects: [cogs]
              indexUrl: https://harbor.example.com/catalog.v1.json
    chart_error: 'does not read repositories or indexUrl'
    settings:
      registry_sources:
        - id: harbor-main
          kind: harbor
          url: https://harbor.example.com
          projects: [cogs]
          index_url: https://harbor.example.com/catalog.v1.json
    app_error: 'does not read index_url'

  - name: static with projects
    layers: [template]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha], projects: [cogs]}
    chart_error: 'does not read projects or apiUrl'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha], projects: [cogs]}
    app_error: 'does not read projects'

  - name: static with apiUrl
    layers: [template]
    values:
      cogs:
        registry:
          sources:
            - id: public
              kind: static
              url: https://registry.example.com
              repositories: [cogs/alpha]
              apiUrl: http://registry.svc:5000
    chart_error: 'does not read projects or apiUrl'
    settings:
      registry_sources:
        - id: public
          kind: static
          url: https://registry.example.com
          repositories: [cogs/alpha]
          api_url: http://registry.svc:5000
    app_error: 'does not read api_url'

  - name: static with a webhook block
    layers: [template]
    values:
      cogs:
        registry:
          sources:
            - id: public
              kind: static
              url: https://registry.example.com
              repositories: [cogs/alpha]
              webhook: {existingSecret: x}
    chart_error: 'has no webhook'
    settings:
      registry_sources:
        - id: public
          kind: static
          url: https://registry.example.com
          repositories: [cogs/alpha]
          webhook_secret_env: COLLAB_HUB_COGS_SOURCE_PUBLIC_WEBHOOK_SECRET
    env:
      COLLAB_HUB_COGS_SOURCE_PUBLIC_WEBHOOK_SECRET: hook-secret-value
    app_error: 'has no webhook; webhook_secret is not read'

  # --- URLs embedding credentials: schema and template both refuse; the API too --

  - name: url with embedded credentials
    layers: [schema, template]
    values:
      cogs:
        registry:
          sources:
            - {id: s, kind: static, url: 'https://robot:REVIEW_SYNTHETIC@registry.example.com', repositories: [cogs/alpha]}
    chart_error: 'embeds a username or password|pattern'
    template_error: 'embeds a username or password'
    schema_error: 'url.*pattern'
    settings:
      registry_sources:
        - {id: s, kind: static, url: 'https://robot:REVIEW_SYNTHETIC@registry.example.com', repositories: [cogs/alpha]}
    app_error: 'must not embed a username or password'

  - name: apiUrl with embedded credentials
    layers: [schema, template]
    values:
      cogs:
        registry:
          sources:
            - id: harbor-main
              kind: harbor
              url: https://harbor.example.com
              projects: [cogs]
              apiUrl: 'http://robot:REVIEW_SYNTHETIC@harbor-core.svc'
    chart_error: 'embeds a username or password|pattern'
    template_error: 'embeds a username or password'
    schema_error: 'apiUrl.*pattern'
    settings:
      registry_sources:
        - id: harbor-main
          kind: harbor
          url: https://harbor.example.com
          projects: [cogs]
          api_url: 'http://robot:REVIEW_SYNTHETIC@harbor-core.svc'
    app_error: 'must not embed a username or password'

  - name: tokenUrl with embedded credentials
    layers: [schema, template]
    values:
      cogs:
        registry:
          sources:
            - id: harbor-main
              kind: harbor
              url: https://harbor.example.com
              projects: [cogs]
              tokenUrl: 'http://robot:REVIEW_SYNTHETIC@harbor-core.svc/service/token'
    chart_error: 'embeds a username or password|pattern'
    template_error: 'embeds a username or password'
    schema_error: 'tokenUrl.*pattern'
    settings:
      registry_sources:
        - id: harbor-main
          kind: harbor
          url: https://harbor.example.com
          projects: [cogs]
          token_url: 'http://robot:REVIEW_SYNTHETIC@harbor-core.svc/service/token'
    app_error: 'must not embed a username or password'

  - name: indexUrl with embedded credentials
    layers: [schema, template]
    values:
      cogs:
        registry:
          sources:
            - id: public
              kind: static
              url: https://registry.example.com
              repositories: [cogs/alpha]
              indexUrl: 'https://robot:REVIEW_SYNTHETIC@registry.example.com/catalog.v1.json'
    chart_error: 'embeds a username or password|pattern'
    template_error: 'embeds a username or password'
    schema_error: 'indexUrl.*pattern'
    settings:
      registry_sources:
        - id: public
          kind: static
          url: https://registry.example.com
          repositories: [cogs/alpha]
          index_url: 'https://robot:REVIEW_SYNTHETIC@registry.example.com/catalog.v1.json'
    app_error: 'must not embed a username or password'

  - name: serving enabled with zero sources
    layers: [template]
    values:
      cogs:
        serve: {enabled: true, publicUrl: https://hub.example.com}
    chart_error: 'cogs.serve.enabled=true with no cogs.registry.sources'
    settings:
      serve: {enabled: true, public_url: https://hub.example.com}
    app_error: 'cogs.serve.enabled is true but cogs.registry_sources is empty'

  - name: serving enabled with no public URL to hand out
    layers: [template]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
        serve: {enabled: true}
    chart_error: 'cogs.serve.enabled=true but the Hub.s public URL is unknown'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
      serve: {enabled: true}
    app_error: 'cogs.serve.enabled is true but cogs.serve.public_url is empty'

  - name: serve public URL on another host than the API
    layers: [template]
    values:
      api:
        nebariapp: {enabled: true, hostname: hub.example.com}
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
        serve: {enabled: true, publicUrl: 'https://cogs.example.com', routeTimeout: false}
    chart_error: 'cogs.serve.publicUrl names host cogs.example.com, but the Hub API is served on hub.example.com'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
      serve: {enabled: true, public_url: 'https://cogs.example.com'}
    why_chart_only: >-
      The API is not told which host the chart routes it on; it sees one
      public URL and serves /v2 beside /v1 on whatever origin reaches it. It
      does refuse a public URL that disagrees with web.public_base_url, the
      one other statement of its own origin, which api/tests covers.

  # --- structure and grammar: schema, mirrored by the API's own validators -------

  - name: unknown serve key
    layers: [schema]
    values:
      cogs:
        serve: {enabld: true}
    chart_error: 'enabld.*not allowed'
    settings:
      serve: {enabld: true}
    app_error: 'enabld\s+Extra inputs are not permitted'
    compare_render: false   # the chart renders nothing for a key it does not know

  - name: serve public URL with a path
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
        serve: {enabled: true, publicUrl: 'https://hub.example.com/registry'}
    chart_error: 'publicUrl.*(pattern|match)'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
      serve: {enabled: true, public_url: 'https://hub.example.com/registry'}
    app_error: 'must be a bare origin'

  - name: serve public URL with embedded credentials
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
        serve: {enabled: true, publicUrl: 'https://user:pw@hub.example.com'}
    chart_error: 'publicUrl.*(pattern|match)'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
      serve: {enabled: true, public_url: 'https://user:pw@hub.example.com'}
    app_error: 'must not embed a username or password'

  - name: serve public URL that is not http(s)
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
        serve: {enabled: true, publicUrl: 'oci://hub.example.com'}
    chart_error: 'publicUrl.*(pattern|match)'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
      serve: {enabled: true, public_url: 'oci://hub.example.com'}
    app_error: 'must be an http\(s\) origin with a host'

  - name: serve public URL with an out-of-range port
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
        serve: {enabled: true, publicUrl: 'https://hub.example.com:99999'}
    chart_error: 'publicUrl.*(pattern|match)'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
      serve: {enabled: true, public_url: 'https://hub.example.com:99999'}
    app_error: 'has an invalid port'

  - name: serve public URL with a trailing slash
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
        serve: {enabled: true, publicUrl: 'https://hub.example.com/'}
    chart_error: 'publicUrl.*(pattern|match)'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
      serve: {enabled: true, public_url: 'https://hub.example.com/'}
    app_error: 'must be a bare origin'

  - name: blob redirect host with a scheme
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha], blobRedirectHosts: ['https://storage.example.com']}
    chart_error: 'blobRedirectHosts.*(pattern|match)'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha], blob_redirect_hosts: ['https://storage.example.com']}
    app_error: 'is not a hostname or a leading-dot suffix'

  - name: duplicate blob redirect hosts
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha], blobRedirectHosts: [storage.example.com, storage.example.com]}
    chart_error: 'blobRedirectHosts.*are equal'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha], blob_redirect_hosts: [storage.example.com, storage.example.com]}
    app_error: 'blob_redirect_hosts lists .* twice'

  - name: registry credential lifetime below the floor
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
        serve: {enabled: true, publicUrl: https://hub.example.com, credentialTtlSeconds: 5}
    chart_error: 'credentialTtlSeconds.*(minimum|greater than or equal)'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
      serve: {enabled: true, public_url: https://hub.example.com, credential_ttl_seconds: 5}
    app_error: 'greater than or equal to 60'

  - name: pull token lifetime above the ceiling
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
        serve: {enabled: true, publicUrl: https://hub.example.com, tokenTtlSeconds: 7200}
    chart_error: 'tokenTtlSeconds.*(maximum|less than or equal)'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
      serve: {enabled: true, public_url: https://hub.example.com, token_ttl_seconds: 7200}
    app_error: 'less than or equal to 3600'

  - name: blob size limit of zero
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
        serve: {enabled: true, publicUrl: https://hub.example.com, maxBlobBytes: 0}
    chart_error: 'maxBlobBytes.*(minimum|greater than or equal)'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
      serve: {enabled: true, public_url: https://hub.example.com, max_blob_bytes: 0}
    app_error: 'greater than or equal to 1'

  - name: blob time limit above the ceiling
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
        serve: {enabled: true, publicUrl: https://hub.example.com, maxBlobSeconds: 100000}
    chart_error: 'maxBlobSeconds.*(maximum|less than or equal)'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
      serve: {enabled: true, public_url: https://hub.example.com, max_blob_seconds: 100000}
    app_error: 'less than or equal to 21600'

  - name: unknown cogs key
    layers: [schema]
    values:
      cogs:
        bogus: 1
    chart_error: 'bogus.*not allowed'
    settings:
      bogus: 1
    app_error: 'bogus\s+Extra inputs are not permitted'
    compare_render: false   # the chart renders nothing for a key it does not know

  - name: unknown source key
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha], repos: [x]}
    chart_error: 'repos.*not allowed'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha], repos: [x]}
    app_error: 'repos\s+Extra inputs are not permitted'
    compare_render: false   # the JSON helper renders only the keys it knows

  - name: unknown kind
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: quay, url: https://registry.example.com, repositories: [cogs/alpha]}
    chart_error: 'kind.*(one of|enum)'
    settings:
      registry_sources:
        - {id: public, kind: quay, url: https://registry.example.com, repositories: [cogs/alpha]}
    app_error: "kind\\s+Input should be 'harbor' or 'static'"

  - name: missing url
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: s, kind: static, repositories: [cogs/alpha]}
    chart_error: "url is required|missing propert(y|ies).*url"
    settings:
      registry_sources:
        - {id: s, kind: static, url: null, repositories: [cogs/alpha]}
    app_error: 'url\s+Input should be a valid string'

  - name: id with an uppercase letter
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: Public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
    chart_error: 'id.*pattern'
    settings:
      registry_sources:
        - {id: Public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
    app_error: 'must match'

  - name: url that is not http(s)
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: 'ftp://registry.example.com', repositories: [cogs/alpha]}
    chart_error: 'url.*pattern'
    settings:
      registry_sources:
        - {id: public, kind: static, url: 'ftp://registry.example.com', repositories: [cogs/alpha]}
    app_error: 'must be an http\(s\) URL'

  - name: url with a query string
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: 'https://registry.example.com/?x=1', repositories: [cogs/alpha]}
    chart_error: 'url.*pattern'
    settings:
      registry_sources:
        - {id: public, kind: static, url: 'https://registry.example.com/?x=1', repositories: [cogs/alpha]}
    app_error: 'must not carry a query or fragment'

  - name: project name with a slash
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: harbor-main, kind: harbor, url: https://harbor.example.com, projects: [cogs/x]}
    chart_error: 'projects.*pattern'
    settings:
      registry_sources:
        - {id: harbor-main, kind: harbor, url: https://harbor.example.com, projects: [cogs/x]}
    app_error: 'is not a registry project name'

  - name: repository path with uppercase letters
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [Cogs/Alpha]}
    chart_error: 'repositories.*pattern'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [Cogs/Alpha]}
    app_error: 'is not an OCI repository path'

  - name: request timeout over the limit
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha], requestTimeoutSeconds: 61}
    chart_error: 'requestTimeoutSeconds.*(maximum|less than or equal)'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha], request_timeout_seconds: 61}
    app_error: 'less than or equal to 60'

  - name: sweep interval below the floor
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
        index: {enabled: true, intervalSeconds: 1}
    chart_error: 'intervalSeconds.*(minimum|greater than or equal)'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
      index: {enabled: true, interval_seconds: 1}
    app_error: 'greater than or equal to 10'

  - name: url with an out-of-range port
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: 'https://registry.example.com:99999', repositories: [cogs/alpha]}
    chart_error: 'url.*pattern'
    settings:
      registry_sources:
        - {id: public, kind: static, url: 'https://registry.example.com:99999', repositories: [cogs/alpha]}
    app_error: 'has an invalid port'

  - name: url with no host
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: 'https://:443', repositories: [cogs/alpha]}
    chart_error: 'url.*pattern'
    settings:
      registry_sources:
        - {id: public, kind: static, url: 'https://:443', repositories: [cogs/alpha]}
    app_error: 'must be an http\(s\) URL with a host'

  - name: url with a broken IPv6 literal
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: 'https://[broken', repositories: [cogs/alpha]}
    chart_error: 'url.*pattern'
    settings:
      registry_sources:
        - {id: public, kind: static, url: 'https://[broken', repositories: [cogs/alpha]}
    app_error: 'Invalid IPv6 URL'

  - name: url with an empty query
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: 'https://registry.example.com/?', repositories: [cogs/alpha]}
    chart_error: 'url.*pattern'
    settings:
      registry_sources:
        - {id: public, kind: static, url: 'https://registry.example.com/?', repositories: [cogs/alpha]}
    app_error: 'must not carry a query or fragment'

  - name: duplicate repositories
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha, cogs/alpha]}
    chart_error: 'repositories.*equal'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha, cogs/alpha]}
    app_error: "lists 'cogs/alpha' twice"

  - name: duplicate projects
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: harbor-main, kind: harbor, url: https://harbor.example.com, projects: [cogs, cogs]}
    chart_error: 'projects.*equal'
    settings:
      registry_sources:
        - {id: harbor-main, kind: harbor, url: https://harbor.example.com, projects: [cogs, cogs]}
    app_error: "lists 'cogs' twice"

  - name: missing id
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
    chart_error: "missing propert(y|ies).*id"
    settings:
      registry_sources:
        - {id: null, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
    app_error: 'id\s+Input should be a valid string'

  - name: missing kind
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, url: https://registry.example.com, repositories: [cogs/alpha]}
    chart_error: "missing propert(y|ies).*kind"
    settings:
      registry_sources:
        - {id: public, kind: null, url: https://registry.example.com, repositories: [cogs/alpha]}
    app_error: "kind\\s+Input should be 'harbor' or 'static'"

  - name: empty id
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: '', kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
    chart_error: 'id.*pattern'
    settings:
      registry_sources:
        - {id: '', kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
    app_error: 'registry source id must not be empty'

  - name: id over 64 characters
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
    chart_error: 'id.*maxLength'
    settings:
      registry_sources:
        - {id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
    app_error: 'at most 64 characters'

  - name: request timeout of zero
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha], requestTimeoutSeconds: 0}
    chart_error: 'requestTimeoutSeconds.*(exclusiveMinimum|greater than)'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha], request_timeout_seconds: 0}
    app_error: 'greater than 0'

  - name: sweep interval above the ceiling
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
        index: {enabled: true, intervalSeconds: 90000}
    chart_error: 'intervalSeconds.*(maximum|less than or equal)'
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
      index: {enabled: true, interval_seconds: 90000}
    app_error: 'less than or equal to 86400'

  - name: unknown index key
    layers: [schema]
    values:
      cogs:
        index: {intervalSecs: 5}
    chart_error: 'intervalSecs.*not allowed'
    settings:
      index: {intervalSecs: 5}
    app_error: 'intervalSecs\s+Extra inputs are not permitted'
    compare_render: false   # the chart renders nothing for a key it does not know

  - name: bracketed host that is not an IPv6 address
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: 'https://[1234]', repositories: [cogs/alpha]}
    chart_error: 'url.*pattern'
    settings:
      registry_sources:
        - {id: public, kind: static, url: 'https://[1234]', repositories: [cogs/alpha]}
    app_error: 'does not appear to be an IPv4 or IPv6 address'

  - name: IPv6 literal with two compressions
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: 'https://[1::2::3]', repositories: [cogs/alpha]}
    chart_error: 'url.*pattern'
    settings:
      registry_sources:
        - {id: public, kind: static, url: 'https://[1::2::3]', repositories: [cogs/alpha]}
    app_error: 'does not appear to be an IPv4 or IPv6 address'

  - name: IPv4 address in brackets
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: 'https://[127.0.0.1]', repositories: [cogs/alpha]}
    chart_error: 'url.*pattern'
    settings:
      registry_sources:
        - {id: public, kind: static, url: 'https://[127.0.0.1]', repositories: [cogs/alpha]}
    app_error: 'IPv4 address cannot be in brackets'

  - name: apiUrl with an out-of-range port
    layers: [schema]
    values:
      cogs:
        registry:
          sources:
            - {id: harbor-main, kind: harbor, url: https://harbor.example.com, projects: [cogs], apiUrl: 'http://harbor-core.svc:70000'}
    chart_error: 'apiUrl'
    settings:
      registry_sources:
        - {id: harbor-main, kind: harbor, url: https://harbor.example.com, projects: [cogs], api_url: 'http://harbor-core.svc:70000'}
    app_error: 'api_url has an invalid port'

  # --- rules that can only live in the chart ------------------------------------
  # The API accepts what the chart would have rendered; why_chart_only says why
  # the rule cannot be mirrored.

  - name: credentials block with an empty Secret name
    layers: [template]
    values:
      cogs:
        registry:
          sources:
            - id: harbor-main
              kind: harbor
              url: https://harbor.example.com
              projects: [cogs]
              credentials: {existingSecret: ''}
    chart_error: 'credentials.existingSecret is empty'
    settings:
      registry_sources:
        - {id: harbor-main, kind: harbor, url: https://harbor.example.com, projects: [cogs]}
    why_chart_only: >-
      An empty name mounts nothing, so the API receives an anonymous source
      and cannot tell that a credential was intended.

  - name: webhook block with an empty Secret name
    layers: [template]
    values:
      cogs:
        registry:
          sources:
            - id: harbor-main
              kind: harbor
              url: https://harbor.example.com
              projects: [cogs]
              webhook: {existingSecret: ''}
    chart_error: 'webhook.existingSecret is empty'
    settings:
      registry_sources:
        - {id: harbor-main, kind: harbor, url: https://harbor.example.com, projects: [cogs]}
    why_chart_only: >-
      An empty name mounts nothing, so the API receives a source without a
      webhook secret and cannot tell that one was intended.

  - name: ids colliding after env-name derivation
    layers: [template]
    values:
      cogs:
        registry:
          sources:
            - {id: pub.lic, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
            - {id: pub-lic, kind: static, url: https://other.example.com, repositories: [cogs/beta]}
    chart_error: 'same Secret env var names'
    settings:
      registry_sources:
        - {id: pub.lic, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
        - {id: pub-lic, kind: static, url: https://other.example.com, repositories: [cogs/beta]}
    why_chart_only: >-
      Distinct ids are valid to the API. The collision is in the chart's
      derived variable names: had both sources named a Secret they would read
      the same variables, and the API sees only the names, not how they were
      derived.

  - name: CA ConfigMap with an empty key
    layers: [template]
    values:
      cogs:
        caBundle: {configMap: ca, key: ''}
    chart_error: 'cogs.caBundle.key must name'
    settings: {}
    why_chart_only: >-
      The bundle is mounted by the chart; the API receives only a file path
      per source, and a source with no path uses system trust.

  - name: extraEnv may not set a cogs setting
    layers: [template]
    values:
      api:
        deployment:
          extraEnv:
            - {name: COLLAB_HUB_API__COGS__INDEX__ENABLED, value: 'true'}
    chart_error: 'may not set COLLAB_HUB_API__COGS__INDEX__ENABLED'
    why_chart_only: >-
      extraEnv is the chart's escape hatch around its own rendering; the API
      cannot know which of its variables the chart rendered and which were
      appended.
    compare_render: false   # the appended variable duplicates the chart's own

  - name: extraEnv may not set a source Secret variable
    layers: [template]
    values:
      api:
        deployment:
          extraEnv:
            - {name: COLLAB_HUB_COGS_SOURCE_X_PASSWORD, value: pw}
    chart_error: 'may not set COLLAB_HUB_COGS_SOURCE_X_PASSWORD'
    why_chart_only: >-
      A literal value under a derived Secret variable name would bypass the
      Secret mount; the API reads the variable and cannot tell a mounted value
      from an appended one.
    compare_render: false

# --- configurations at the boundary that every layer must accept -------------
# The full chart renders each, the rendered settings equal `settings`, and
# Config accepts them. These pin the schema against becoming stricter than the
# API by accident (ports, IPv6 literals, in-cluster hostnames, dotted project
# names, paths).
accepted:
  - name: ports, an IPv6 literal, in-cluster names, a dotted project, a path
    values:
      cogs:
        registry:
          sources:
            - {id: edge.a, kind: static, url: 'https://registry.example.com:65535/v2', repositories: [cogs/alpha, team/cog-beta.v2]}
            - {id: edge-b, kind: static, url: 'https://[::1]:5000', indexUrl: 'https://[::1]:5000/catalog.v1.json'}
            - {id: edge-c, kind: static, url: 'https://[2001:db8::1]:443/v2', repositories: [cogs/alpha]}
            - {id: edge-d, kind: static, url: 'https://[::ffff:10.0.0.1]', repositories: [cogs/alpha]}
            - {id: edge-e, kind: static, url: 'https://[fe80::1%25eth0]:5000', repositories: [cogs/alpha]}
            - {id: edge-f, kind: static, url: 'https://registry.example.com:00080', repositories: [cogs/alpha]}
            - id: harbor_c
              kind: harbor
              url: https://harbor.example.com
              apiUrl: http://harbor-core.harbor.svc.cluster.local:80
              tokenUrl: http://harbor-core.harbor.svc.cluster.local:80/service/token
              projects: [cogs, team.x]
              requestTimeoutSeconds: 60
        index: {enabled: true, intervalSeconds: 10}
    settings:
      registry_sources:
        - {id: edge.a, kind: static, url: 'https://registry.example.com:65535/v2', repositories: [cogs/alpha, team/cog-beta.v2]}
        - {id: edge-b, kind: static, url: 'https://[::1]:5000', index_url: 'https://[::1]:5000/catalog.v1.json'}
        - {id: edge-c, kind: static, url: 'https://[2001:db8::1]:443/v2', repositories: [cogs/alpha]}
        - {id: edge-d, kind: static, url: 'https://[::ffff:10.0.0.1]', repositories: [cogs/alpha]}
        - {id: edge-e, kind: static, url: 'https://[fe80::1%25eth0]:5000', repositories: [cogs/alpha]}
        - {id: edge-f, kind: static, url: 'https://registry.example.com:00080', repositories: [cogs/alpha]}
        - id: harbor_c
          kind: harbor
          url: https://harbor.example.com
          api_url: http://harbor-core.harbor.svc.cluster.local:80
          token_url: http://harbor-core.harbor.svc.cluster.local:80/service/token
          projects: [cogs, team.x]
          request_timeout_seconds: 60
      index: {enabled: true, interval_seconds: 10}

  - name: serving with an explicit public URL on a port, at every limit
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha], blobRedirectHosts: [storage.example.com, .s3.amazonaws.com, 10.0.0.7]}
        serve:
          enabled: true
          publicUrl: 'https://hub.example.com:8443'
          credentialTtlSeconds: 60
          tokenTtlSeconds: 3600
          maxBlobBytes: 5368709120
          maxBlobSeconds: 21600
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha], blob_redirect_hosts: [storage.example.com, .s3.amazonaws.com, 10.0.0.7]}
      serve:
        enabled: true
        public_url: 'https://hub.example.com:8443'
        credential_ttl_seconds: 60
        token_ttl_seconds: 3600
        max_blob_bytes: 5368709120
        max_blob_seconds: 21600

  - name: serving turned off renders nothing, whatever else the block says
    values:
      cogs:
        serve: {enabled: false, publicUrl: 'https://hub.example.com', tokenTtlSeconds: 60}
    settings:
      registry_sources: []

  # The indexer Deployment's environment is the one compared (it is the
  # sweeping process): with serving on it must say so, or its sweeps follow
  # redirects outside the serving policy (docs/cog-registry.md).
  - name: serving with the indexer on reaches the indexer too
    values:
      cogs:
        registry:
          sources:
            - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
        serve: {enabled: true, publicUrl: 'https://hub.example.com'}
        index: {enabled: true}
    settings:
      registry_sources:
        - {id: public, kind: static, url: https://registry.example.com, repositories: [cogs/alpha]}
      serve: {enabled: true, public_url: 'https://hub.example.com'}
      index: {enabled: true}
