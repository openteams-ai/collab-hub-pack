name: Test

# Runs the Collab Hub API test suite (pytest, in api/). Fork-safe: no secrets,
# read-only checkout. uv provisions the Python and the `test` group: `test` on
# the version api/.python-version pins (the one the image runs), and
# `test-python-floor` on the oldest version requires-python allows.
#
# A PostgreSQL service backs the live suites, and a step asserts they ran:
# without the database, `skipif` silently removes every test that touches real
# SQL -- one organization under concurrent acceptance, a token that cannot be
# redeemed twice, an audited mutation committing with its event row or not at
# all -- while the job stays green.

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/test.yaml"
  pull_request: {}   # runs on every PR so it can be a required status check
  merge_group: {}    # and on each merge-queue group; a required check that never reports there blocks the queue

jobs:
  test:
    runs-on: ubuntu-latest
    # A real database, so the live-Postgres tests run here and do not skip:
    # migrations, row locks and transaction rollbacks are what a fake cannot
    # show. Trust auth because the container lives for this job only and is
    # reachable only from the runner; there is no password to hard-code.
    services:
      postgres:
        image: postgres:16.15@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: collab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COLLAB_HUB_TEST_POSTGRES_URL: postgresql://postgres@localhost:5432/collab_test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # patch-coverage diffs against the base branch

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Run tests with coverage
        working-directory: api
        # Not --frozen: the rename changes the project's own package entry, so
        # uv reconciles uv.lock's project record on sync. Deps stay pinned.
        # --cov-fail-under enforces the global floor here (not in addopts) so a
        # scoped local run isn't failed for not exercising the whole package.
        run: uv run --group test pytest --cov-fail-under=85

      - name: Confirm the live suites actually ran
        working-directory: api
        # The failure this catches is silent and total: rename the variable, or
        # let the service drop out, and `skipif` quietly removes the live tests
        # while the job stays green. A count assertion is the only thing that
        # notices, because a skipped test looks exactly like a test that had
        # nothing to say.
        run: |
          set -euo pipefail
          live=$(uv run --group test pytest --no-cov -q --collect-only \
            -k "live or differential" 2>/dev/null | tail -1)
          echo "collected: ${live}"
          count=$(uv run --group test pytest --no-cov -q -k "live or differential" 2>&1 \
            | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+')
          echo "live tests passed: ${count}"
          if [ "${count:-0}" -lt 100 ]; then
            echo "expected the live suites to run (>=100 tests); the service or the" >&2
            echo "environment variable is not reaching pytest." >&2
            exit 1
          fi

      - name: Patch coverage (changed lines)
        if: github.event_name == 'pull_request'
        working-directory: api
        # New and changed lines are held to a higher bar than the legacy global
        # floor: cover what you add. Compares this PR's coverage.xml against the
        # base branch.
        run: |
          uv run --group test diff-cover coverage.xml \
            --compare-branch "origin/${{ github.base_ref }}" \
            --fail-under 90

  # A separate job rather than a matrix, so the required `test` check keeps its
  # name. Coverage is enforced once, above.
  test-python-floor:
    name: Test (Python 3.13)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"   # overrides api/.python-version
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # ruff targets the floor, so it reports syntax newer than 3.13 -- such as
      # the unparenthesized `except A, B:` that only 3.14 accepts.
      - name: Lint
        working-directory: api
        run: uv run --with ruff ruff check src tests

      - name: Run tests
        working-directory: api
        run: uv run --group test pytest
  admin-ui:
    # The admin panel's own suite. Separate job rather than a step on the
    # Python one: the two share no toolchain, and a Node failure should read as
    # a Node failure rather than as "the API tests did not run".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/admin-ui/package-lock.json

      # `ci` installs exactly what the lockfile pins, and `--ignore-scripts`
      # runs no package lifecycle hook: nothing in this dependency set needs
      # one, and CI is where a compromised transitive dependency would most
      # like to execute.
      - name: Install
        working-directory: api/admin-ui
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit
        working-directory: api/admin-ui
        run: npm audit --audit-level=low

      - name: Typecheck
        working-directory: api/admin-ui
        run: npm run typecheck

      - name: Test
        working-directory: api/admin-ui
        run: npm test

      - name: Build
        working-directory: api/admin-ui
        run: npm run build
