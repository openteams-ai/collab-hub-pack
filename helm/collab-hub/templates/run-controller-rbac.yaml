{{- $controller := .Values.runs.controller }}
{{- if and .Values.api.enabled $controller.enabled (eq $controller.location "remote") }}
{{- $component := "run-controller" }}
{{- $name := include "collab-hub.component-name" (dict "top" . "component" $component) }}
{{- $workers := include "collab-hub.worker-namespace" . }}
{{- /* The run controller's identity, and the only workload permissions the chart grants (ADR-0002
invariant 3): over the kinds it materializes, with the verbs it uses, in the namespace of the workers'
own (issue #253) and nowhere else. The ServiceAccount is in the release namespace, the controller's
pod's; the Role and the RoleBinding are in the workers' namespace, so the identity can start a pod
under no ServiceAccount of the release namespace and mount no Secret of it, the database URL and the
Keycloak client secret among them. Nothing on the API's ServiceAccount. Workers themselves carry no
ServiceAccount token. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "collab-hub.labels" (dict "top" . "component" $component) | nindent 4 }}
  {{- with $controller.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $workers }}
  labels:
    {{- include "collab-hub.labels" (dict "top" . "component" $component) | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "delete", "deletecollection"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "patch", "delete", "deletecollection"]
  {{- /* One Secret per worker carries its run token and what the models block delivers (a model key), so
  neither is a literal on a pod template that `get deployments` reads. The Secret is owned by the worker's
  Deployment and collected with it: the controller creates Secrets, deletes one by name only when a
  Deployment it patched left one behind, and never reads, lists or sweeps them, so `patch`,
  `deletecollection`, `get` and `list` stay out; and the Role being in the workers' namespace, the hub's own
  Secrets and Helm's release records are out of reach whatever the verbs. */}}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
  {{- /* An uninstall evicts the Cog's package from the shared artifact cache (worker.cacheClaim) through a pod
  of this namespace that mounts the claim and runs the puller's `evict`, since the claim is of this namespace
  and the controller's pod is not: the controller creates that pod, reads its phase, and deletes it. */}}
  {{- if $controller.worker.cacheClaim }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $workers }}
  labels:
    {{- include "collab-hub.labels" (dict "top" . "component" $component) | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
