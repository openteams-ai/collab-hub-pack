name: Semantic Release

# Every merge to main that carries a releasable commit becomes a chart
# release, without a release PR and without writing to main. Commits follow
# Conventional Commits and versions follow Semantic Versioning:
#   https://www.conventionalcommits.org/en/v1.0.0/
#   https://semver.org/spec/v2.0.0.html
#
# 1. semantic-release names the version from the squash commits since the last
#    v<version> tag, and the merged commit on main is tagged v<version>. That
#    tag is the version lineage; nothing else is pushed to main.
# 2. A release commit is made on top of that commit, pinning the version into
#    helm/collab-hub/Chart.yaml, api/pyproject.toml, cli/pyproject.toml and
#    the CLI's __version__ (scripts/release/bump-version.py). It is pushed
#    only as the tag collab-hub-<version>, the name release.yaml gives the
#    release, and never to a branch.
# 3. build-images.yaml and release.yaml are dispatched from that tag.
#    release.yaml reads the version from the tag's Chart.yaml and pins the
#    chart to the sha-<short> image that build-images builds from the same
#    ref, then packages it, pushes it to oci://ghcr.io/openteams-ai/charts and
#    attaches it to a GitHub Release.
#
# Those files on main keep a 0.0.0 development placeholder; the released
# version lives in the tags and the GitHub Release. CONTRIBUTING.md describes
# this flow for contributors. GITHUB_TOKEN is enough throughout: tags are not
# branch-protected, and workflow_dispatch is the one event it may start.
#
# Two jobs, so that no npm code runs with write access: `version` runs
# semantic-release as a read-only dry run with no credentials, and `tag` pushes
# the tags and dispatches from a fresh checkout, running no npm code.
# semantic-release and its plugins install with npm ci from
# scripts/release/semantic-release/package-lock.json.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  version:
    name: Name the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: scripts/release/semantic-release/.node-version

      # Every package, transitive ones included, comes from the lockfile, so
      # an upstream release can't change what runs here between merges.
      - name: Install semantic-release
        run: npm ci --prefix scripts/release/semantic-release --ignore-scripts --no-audit --no-fund

      - name: Name the next version
        # Pointed at the checkout itself, so semantic-release's push-permission
        # check passes without any credential; the checkout holds every tag.
        run: |
          scripts/release/semantic-release/node_modules/.bin/semantic-release \
            --dry-run --repository-url "file://${GITHUB_WORKSPACE}"

      - id: version
        name: Resolve the version
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s .next-release ]]; then
            version="$(cat .next-release)"
          else
            # A lineage tag already on this commit means an earlier run released
            # it and may have stopped before the chart tag or the dispatches:
            # recover its version and finish instead of treating it as done.
            lineage="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [[ -z "${lineage}" ]]; then
              echo "No releasable commits since the last release; nothing to release."
              exit 0
            fi
            version="${lineage#v}"
            echo "${lineage} already marks this commit; resuming its release."
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  tag:
    name: Tag and dispatch the chart release
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the two tags
      actions: write # dispatch build-images.yaml and release.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: release
        name: Tag the merge and the release commit
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # The version comes from the job that ran npm code, so it is checked
          # here rather than trusted.
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Refusing version ${VERSION}." >&2; exit 1; }
          lineage="v${VERSION}"
          tag="collab-hub-${VERSION}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify --quiet "refs/tags/${lineage}" >/dev/null; then
            [[ "$(git rev-parse "refs/tags/${lineage}^{commit}")" == "${GITHUB_SHA}" ]] || { echo "${lineage} already marks another commit." >&2; exit 1; }
          else
            git tag "${lineage}" "${GITHUB_SHA}"
            git push origin "refs/tags/${lineage}"
          fi
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            # Tagged by an earlier run whose dispatches may not have run. Both
            # are safe to repeat: release.yaml skips a release that exists.
            echo "${tag} already exists; dispatching its build and release again."
            exit 0
          fi
          git config user.name "OpenTeams Release Bot"
          git config user.email "releases@openteams.com"
          # Detached, so the release commit exists only under its tag and no
          # branch ref, local or remote, ever moves to it.
          git checkout -q --detach "${GITHUB_SHA}"
          python3 scripts/release/bump-version.py "${VERSION}"
          git commit -q -am "chore(release): ${VERSION}"
          git tag -a "${tag}" -m "collab-hub ${VERSION}"
          git push origin "refs/tags/${tag}"

      - name: Dispatch the image build and the chart release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # Both from the tag, so the image is built from the release commit
          # and release.yaml pins the chart to that same commit's sha.
          gh workflow run build-images.yaml --ref "${TAG}"
          gh workflow run release.yaml --ref "${TAG}"
