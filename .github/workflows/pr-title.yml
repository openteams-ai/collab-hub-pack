name: PR Title

# The squash commit that lands on main takes its message from the PR title,
# and semantic-release derives the version from those messages. This check
# makes the title machine-parseable before the PR can merge. The format is
# Conventional Commits 1.0.0:
# https://www.conventionalcommits.org/en/v1.0.0/
# No third-party action: the contract is one regex, asserted here.
# synchronize is kept so the check reports on every head commit; a required
# status check with no result on the current head blocks the merge.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # On a merge-queue group the check reads every squash commit the group
  # would land on main, which is what semantic-release parses, so a title
  # edited at merge time or taken from a single-commit PR cannot slip past
  # it, and neither can an earlier PR in the group whose own run failed.
  merge_group: {}

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional-commit PR title
    runs-on: ubuntu-latest
    steps:
      # The group's commits are those on its head but not yet on the base
      # branch; the clone needs that branch to list them.
      - uses: actions/checkout@v5
        if: github.event_name == 'merge_group'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          # The base branch, not base_sha: base_sha is the previous PR in the
          # queue, so diffing against it would see only this PR's commit.
          GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            # One squash commit per queued PR; its first line is the PR title.
            mapfile -t titles < <(git log --format=%s "origin/${GROUP_BASE_REF#refs/heads/}..HEAD")
          else
            titles=("$PR_TITLE")
          fi
          # type(optional-scope)!: description  — types cover the release
          # mapping (feat = minor, fix/perf = patch, ! or BREAKING CHANGE =
          # major) plus the non-releasing housekeeping types.
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-zA-Z0-9_./-]+\))?!?: .+'
          status=0
          for TITLE in "${titles[@]}"; do
            if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
              echo "Title is conventional: $TITLE"
            else
              echo "::error::Title is not a conventional commit: '$TITLE'"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "Expected: type(scope)?: description — e.g. 'feat(agents): add hub model labels'."
            echo "Types: feat fix perf refactor docs test build ci chore style revert."
            exit 1
          fi
