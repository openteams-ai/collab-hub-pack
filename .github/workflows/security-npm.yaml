name: npm Dependency Audit

# Audits the committed lockfile of each npm project with `npm audit`, through
# scripts/security/check_npm_audit.py: the admin panel (api/admin-ui) and the
# release tooling semantic-release.yml installs
# (scripts/release/semantic-release). Each project's audit-allowlist.json
# lists the advisories it accepts; any other advisory, at --audit-level=low or
# above, fails its check. Fork-safe: no secrets, read-only checkout.
#
# The audit reads package-lock.json only (--package-lock-only), so nothing is
# installed and no dependency's code runs. It runs on every PR and merge
# group, on pushes to main, and weekly, so a newly published advisory, or an
# allowlist entry that has expired or gone stale, shows up on main even in a
# week with no PRs. The release itself never audits (semantic-release.yml
# installs with --no-audit), so an advisory in the release tooling fails PRs
# here but never blocks a release.

on:
  pull_request: {}   # runs on every PR so it can be a required status check
  merge_group: {}    # and on each merge-queue group; a required check that never reports there blocks the queue
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit - ${{ matrix.directory }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One project's advisory should not hide the other's result.
      fail-fast: false
      matrix:
        # Every npm project with a committed package-lock.json.
        directory:
          - api/admin-ui
          - scripts/release/semantic-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The project's own Node, and the npm it bundles, so the audit runs the
      # same npm as the project's install does.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ matrix.directory }}/.node-version

      # The audit check's own refusals, on synthetic reports, so a regression
      # in it can't wave an advisory through the audit below. In each matrix
      # job rather than a job of its own that these depend on: a job skipped
      # because a dependency failed counts as passing for a required check.
      - name: Test the audit check
        run: python3 -m unittest discover --start-directory scripts/security/tests --pattern test_check_npm_audit.py --verbose

      # npm cannot ignore an advisory, and one with no patched release would
      # otherwise block CI until upstream ships one; hence the allowlist. The
      # check also fails on an entry past its expiry, and annotates one no
      # longer reported with a warning rather than failing: that follows from
      # a fix or withdrawal upstream, not from the PR.
      - name: Audit
        env:
          DIRECTORY: ${{ matrix.directory }}
        run: python3 scripts/security/check_npm_audit.py "$DIRECTORY"
