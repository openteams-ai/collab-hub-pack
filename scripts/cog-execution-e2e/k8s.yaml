# Two namespaces, as the chart deploys a hub (issue #253): the driver (the stand-in
# run controller) runs in cogs-e2e under a ServiceAccount of that namespace, and
# its workers are made in cogs-e2e-workers, where its Role and RoleBinding are.
apiVersion: v1
kind: Namespace
metadata:
  name: cogs-e2e
---
apiVersion: v1
kind: Namespace
metadata:
  name: cogs-e2e-workers
  labels:
    # As the chart labels the workers' namespace: the API server admits a worker pod under `restricted`.
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cog-executor
  namespace: cogs-e2e
---
# Least-privilege: the executor may manage exactly the workloads it materializes,
# in the workers' namespace alone (issues #6, #253); it holds nothing in its own. It also reads
# worker pods' logs there, which the driver asserts the second run's cache hit from.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cog-executor
  namespace: cogs-e2e-workers
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "delete", "deletecollection"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cog-executor
  namespace: cogs-e2e-workers
subjects:
  - kind: ServiceAccount
    name: cog-executor
    namespace: cogs-e2e
roleRef:
  kind: Role
  name: cog-executor
  apiGroup: rbac.authorization.k8s.io
---
# The registry the fake Cog is published to and pulled from: an OCI distribution registry in the cluster,
# reached over plain HTTP by its Service name, as a cluster-local registry in development is.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: cogs-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2.8.3
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: cogs-e2e
spec:
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
---
# The cache every worker pod mounts, shared, keyed by each package's pixi.lock digest: what makes a second run on
# the same lock find the package and the environment pixi built for it. kind's default storage class.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cog-cache
  namespace: cogs-e2e
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: op-driver
  namespace: cogs-e2e
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: op-driver
    spec:
      serviceAccountName: cog-executor
      restartPolicy: Never
      containers:
        - name: driver
          image: collab-hub/cog-e2e:test
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "e2e.driver"]
          env:
            - name: E2E_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: E2E_WORKER_NAMESPACE
              value: cogs-e2e-workers
            - name: E2E_RUNNER_IMAGE
              value: collab-hub/cog-e2e:test
            - name: E2E_REGISTRY
              value: registry.cogs-e2e.svc.cluster.local:5000
            - name: E2E_CACHE_CLAIM
              value: cog-cache
            # The key the inventory's model names by reference (env:E2E_MODEL_KEY): the controller's to resolve
            # as a worker starts, and never to put in a manifest, a binding or the Track.
            - name: E2E_MODEL_KEY
              value: e2e-model-key-value
          volumeMounts:
            - name: cog
              mountPath: /cog
              readOnly: true
      volumes:
        - name: cog
          configMap:
            name: e2e-cog
