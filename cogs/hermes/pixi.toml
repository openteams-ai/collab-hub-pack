# The Hermes harness Cog as a package. `serve` is the task the run controller starts a worker with,
# in this environment: Python and Hermes Agent with its ACP extra, pinned by pixi.lock.
[workspace]
name = "hermes"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64"]
# 0.82.1 is the first pixi whose bundled roots exclude the compromised eMudhra chain.
requires-pixi = ">=0.82.1"

[tasks]
serve = "python serve.py"

[dependencies]
# 3.12.16 is the first 3.12 whose ssl module refuses the compromised eMudhra intermediates (#285).
python = ">=3.12.16,<3.13"

[pypi-dependencies]
# 0.19.0 is the last hermes-agent on PyPI: Hermes has since dropped PyPI as a
# distribution channel. Where the Cog gets Hermes from next is tracked in #320.
hermes-agent = { version = "==0.19.0", extras = ["acp", "anthropic"] }
# The worker SDK, from this repository: the Cog lives beside it, so it pins the SDK by path.
collab-hub-cog-worker = { path = "../../worker" }

[pypi-options.dependency-overrides]
# hermes-agent 0.19.0 pins certifi==2026.5.20, which still trusts the compromised
# eMudhra intermediates. Override until the Cog moves to a Hermes that lifts the
# pin (its main already carries certifi==2026.10.19; no PyPI release will, see
# #320), then drop this override only: the worker's own trust-store default
# (serve.py, README) stays.
certifi = ">=2026.10.19"
# hermes-agent 0.19.0 pins PyJWT[crypto]==2.13.0, which has open advisories fixed
# in 2.14.0 and 2.15.0 (#195). The Cog does not reach them: only Hermes's dashboard,
# gateway and Skills Hub use PyJWT, and `hermes acp` never imports it. This keeps
# the lock clear of them all the same. No hermes-agent release on PyPI will lift
# the pin, as Hermes has dropped PyPI as a distribution channel: remove this
# override once the Cog sources Hermes through an alternative distribution
# option (#320).
pyjwt = ">=2.15.0"
