    bearer:
      jwksUrl: https://keycloak.example.test/realms/nebari/protocol/openid-connect/certs
      issuer: https://keycloak.example.test/realms/nebari
      audience: apollo-desktop
web:
  enabled: true
  image:
    tag: sha-abc1234
  nebariapp:
    hostname: collab.example.test
  hubUrl: https://example.test
  llmBaseUrl: https://llm-internal.example.test/v1
  models:
    - id: qwen
      displayName: Qwen
      supportsTools: true
  database:
    existingSecret: web-chat-postgres
    databaseUrlKey: DATABASE_URL
